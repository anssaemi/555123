<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whack-a-Mole Mania Deluxe</title>
<style>
  :root {
    --wood-border: #3e2723;
    --wood-light: #8d6e63;
    --wood-dark: #4e342e;
    --gold: #ffca28;
    --field-border: #1b5e20;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Arial Black', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1b5e20;
    cursor: default;
  }

  /* 고화질 필드 배경 렌더링 */
  #game-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: 
      radial-gradient(ellipse at 50% 20%, #43a047 0%, #2e7d32 55%, #1b5e20 100%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 15px, transparent 15px, transparent 30px);
    cursor: none;
    transition: box-shadow 0.3s ease;
  }

  /* 커스텀 해머 커서 */
  #custom-hammer {
    position: fixed;
    width: 90px;
    height: 90px;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-34px, -34px) rotate(0deg);
    transform-origin: 34px 34px;
    transition: transform 0.04s ease-out;
    filter: drop-shadow(4px 10px 8px rgba(0,0,0,0.55));
    display: none;
  }

  #custom-hammer.swing {
    transform: translate(-34px, -34px) rotate(-48deg) scale(0.92);
    transition: transform 0.03s cubic-bezier(0.1, 0.9, 0.2, 1);
  }

  /* 오디오 컨트롤 버튼 */
  #audio-toggle {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 44px;
    height: 44px;
    background: #5d4037;
    border: 3px solid #ffd54f;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    z-index: 100;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
  }

  /* 목재 아케이드 전광판 HUD */
  #hud-board {
    width: 100%;
    max-width: 580px;
    background: linear-gradient(180deg, #6d4c41 0%, #4e342e 70%, #3e2723 100%);
    border: 5px solid #ffca28;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 3px 6px rgba(255,255,255,0.35);
    padding: 10px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    z-index: 20;
  }

  .stat-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-label {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1.2px;
    color: #ffd54f;
    text-shadow: 1px 1px 2px #000;
  }

  .stat-val {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    text-shadow: 2px 3px 0px #000;
    line-height: 1;
  }

  /* 서든데스 게이지 바 */
  #survival-container {
    width: 100%;
    max-width: 580px;
    height: 24px;
    background: rgba(0,0,0,0.75);
    border: 3px solid #ff3d00;
    border-radius: 14px;
    margin-top: 6px;
    position: relative;
    overflow: hidden;
    display: none;
    box-shadow: 0 0 16px rgba(255, 61, 0, 0.85);
    z-index: 20;
  }

  #survival-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff9100, #ff1744);
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.4);
    transition: width 0.08s linear;
  }

  #survival-text {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    font-weight: 900;
    color: #fff;
    text-shadow: 1px 1px 3px #000;
    letter-spacing: 0.5px;
  }

  /* 3x3 잔디 필드 그리드 */
  #field-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 620px;
    max-height: 620px;
    padding: 8px;
  }

  #field-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 16px;
    width: 100%;
    height: 100%;
  }

  .hole-slot {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 130px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: visible;
  }

  /* 입체적인 흙구멍 & 텍스처 베이스 */
  .hole-back {
    position: absolute;
    bottom: 6px;
    width: 95%;
    height: 60px;
    background: radial-gradient(ellipse at 50% 60%, #150904 0%, #2e170b 60%, #4e2912 100%);
    border-radius: 50%;
    box-shadow: inset 0 10px 16px rgba(0,0,0,0.95), 0 3px 0 rgba(255,255,255,0.1);
    z-index: 1;
  }

  .hole-front {
    position: absolute;
    bottom: -8px;
    width: 108%;
    height: 52px;
    background: radial-gradient(ellipse at 50% 85%, #5d4037 0%, #3e2723 65%, transparent 85%);
    border-bottom: 7px solid #1b5e20;
    border-radius: 50%;
    z-index: 4;
    pointer-events: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.45);
  }

  /* 크기가 135% 확대된 초대형 두더지 래퍼 */
  .mole-wrapper {
    position: absolute;
    bottom: 22px;
    width: 130px;
    height: 148px;
    z-index: 2;
    transform: translateY(160px);
    transition: transform 0.13s cubic-bezier(0.18, 0.89, 0.32, 1.25);
    pointer-events: auto;
    cursor: pointer;
  }

  .mole-wrapper.up {
    transform: translateY(-8px);
  }

  .mole-wrapper.hit {
    transform: translateY(30px) scale(0.95, 0.55) !important;
    transition: transform 0.08s ease-in;
    pointer-events: none;
  }

  .mole-wrapper svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
  }

  /* 정밀 조준 링 및 만화 텍스트 팝업 */
  .hit-crosshair {
    position: fixed;
    width: 52px;
    height: 52px;
    border: 3.5px solid #ff1744;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1.4);
    animation: reticlePop 0.22s ease-out forwards;
    z-index: 999;
  }

  @keyframes reticlePop {
    0% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
  }

  .comic-pop {
    position: absolute;
    font-size: 28px;
    font-weight: 900;
    color: #ffeb3b;
    -webkit-text-stroke: 2px #d32f2f;
    text-shadow: 3px 3px 0px #000;
    pointer-events: none;
    z-index: 999;
    animation: popFade 0.55s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
  }

  @keyframes popFade {
    0% { transform: translate(-50%, 0) scale(0.6) rotate(-15deg); opacity: 0; }
    50% { transform: translate(-50%, -45px) scale(1.25) rotate(5deg); opacity: 1; }
    100% { transform: translate(-50%, -75px) scale(1) rotate(0deg); opacity: 0; }
  }

  /* 모달 윈도우 */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.78);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    backdrop-filter: blur(5px);
  }

  .card-modal {
    background: linear-gradient(180deg, #fffde7 0%, #fff 100%);
    border: 6px solid #4e342e;
    border-radius: 28px;
    padding: 28px 32px;
    text-align: center;
    max-width: 440px;
    width: 90%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
  }

  .card-modal h1 {
    font-size: 34px;
    margin: 0 0 12px 0;
    color: #e65100;
    text-shadow: 2px 2px 0 #ffe082;
  }

  .card-modal p {
    font-size: 15px;
    color: #4e342e;
    line-height: 1.6;
    margin: 0 0 22px 0;
    font-weight: bold;
  }

  .play-btn {
    background: linear-gradient(180deg, #ff9800 0%, #f57c00 100%);
    border: 4px solid #bf360c;
    border-radius: 32px;
    color: #fff;
    font-size: 22px;
    font-weight: 900;
    padding: 14px 40px;
    cursor: pointer;
    box-shadow: 0 6px 0 #bf360c, 0 10px 16px rgba(0,0,0,0.35);
    transition: all 0.08s ease;
  }

  .play-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #bf360c;
  }

  .sudden-flash {
    animation: suddenRed 0.6s infinite alternate;
  }

  @keyframes suddenRed {
    0% { box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.4); }
    100% { box-shadow: inset 0 0 80px rgba(255, 0, 0, 0.9); }
  }
</style>
</head>
<body>

<div id="game-viewport">
  <button id="audio-toggle" title="배경음악 켜기/끄기">🔊</button>

  <!-- 대형 우드 아케이드 HUD -->
  <div id="hud-board">
    <div class="stat-badge">
      <div class="stat-label">SCORE</div>
      <div class="stat-val" id="val-score">0</div>
    </div>
    <div class="stat-badge">
      <div class="stat-label" id="label-timer">TIME</div>
      <div class="stat-val" id="val-timer">60</div>
    </div>
    <div class="stat-badge">
      <div class="stat-label">COMBO</div>
      <div class="stat-val" id="val-combo">0</div>
    </div>
  </div>

  <!-- 동적 서든데스 게이지 (3.5s -> 1.0s) -->
  <div id="survival-container">
    <div id="survival-bar"></div>
    <div id="survival-text">COMBO SURVIVAL (MAX 3.5s)</div>
  </div>

  <!-- 3x3 잔디밭 필드 -->
  <div id="field-container">
    <div id="field-grid">
      <!-- 9개 구멍 동적 마운트 -->
    </div>
  </div>
</div>

<!-- 커스텀 메탈릭 해머 커서 -->
<div id="custom-hammer">
  <svg viewBox="0 0 100 100" width="100%" height="100%">
    <rect x="28" y="28" width="14" height="66" rx="6" fill="#8d6e63" stroke="#3e2723" stroke-width="3.5" transform="rotate(45 35 61)"/>
    <rect x="14" y="14" width="40" height="40" rx="9" fill="#546e7a" stroke="#263238" stroke-width="4.5" transform="rotate(-45 34 34)"/>
    <rect x="18" y="18" width="32" height="12" rx="4" fill="#90a4ae" transform="rotate(-45 34 34)"/>
    <circle cx="34" cy="34" r="4" fill="#ff1744"/>
  </svg>
</div>

<!-- 시작 모달 -->
<div id="start-modal" class="modal-overlay">
  <div class="card-modal">
    <h1>두더지 매니아 DX</h1>
    <p>
      💥 초대형 두더지를 <strong>단 1번</strong>의 타격으로 스매시!<br>
      💣 <strong>폭탄</strong>을 치면 콤보 파괴 및 즉시 감점!<br>
      ⚡ <strong>1분 후 서든데스</strong>: 콤보 타이머가 <strong>3.5초에서 1.0초까지</strong> 점점 줄어듭니다!
    </p>
    <button class="play-btn" id="btn-start">게임 시작! 🔨</button>
  </div>
</div>

<!-- 게임 오버 모달 -->
<div id="gameover-modal" class="modal-overlay" style="display:none;">
  <div class="card-modal">
    <h1 id="over-title">GAME OVER</h1>
    <p id="over-desc">기록을 확인하세요!</p>
    <div style="font-size: 32px; font-weight:900; color:#d84315; margin-bottom: 8px;" id="over-score">0점</div>
    <div style="font-size: 16px; color:#4e342e; margin-bottom: 22px; font-weight:bold;" id="over-maxcombo">최고 콤보: 0연속</div>
    <button class="play-btn" id="btn-restart">다시 하기 🔄</button>
  </div>
</div>

<script>
(() => {
  const state = {
    score: 0,
    timeLeft: 60,
    combo: 0,
    maxCombo: 0,
    isPlaying: false,
    isSuddenDeath: false,
    suddenDuration: 0,
    currentMaxSurvival: 3.5,
    survivalTimer: 3.5,
    soundEnabled: true,
    holes: Array(9).fill(null).map(() => ({ active: false, moleType: null, timer: null }))
  };

  const MAX_CONCURRENT_MOLES = 4;
  let gameTickInterval = null;
  let spawnTimeout = null;

  // --- Web Audio 사운드 & 8비트 BGM 엔진 ---
  let audioCtx = null;
  let bgmInterval = null;
  let bgmStep = 0;

  // 레트로 아케이드 8비트 BGM 멜로디 룩업 테이블
  const MELODY = [
    261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63, 0,
    293.66, 349.23, 440.00, 587.33, 440.00, 349.23, 293.66, 0,
    329.63, 392.00, 493.88, 659.25, 493.88, 392.00, 329.63, 0,
    392.00, 329.63, 293.66, 261.63, 293.66, 329.63, 261.63, 0
  ];
  const BASS = [
    130.81, 0, 130.81, 0, 146.83, 0, 146.83, 0,
    164.81, 0, 164.81, 0, 130.81, 0, 196.00, 0
  ];

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function startBgm() {
    stopBgm();
    if (!state.soundEnabled) return;
    initAudio();
    bgmStep = 0;

    const tempo = state.isSuddenDeath ? 120 : 150; // 서든데스 시 신나는 고속 템포
    bgmInterval = setInterval(playBgmStep, tempo);
  }

  function stopBgm() {
    if (bgmInterval) {
      clearInterval(bgmInterval);
      bgmInterval = null;
    }
  }

  function playBgmStep() {
    if (!state.isPlaying || !state.soundEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;

    // 1. 리드 신스 (스퀘어 웨이브)
    const note = MELODY[bgmStep % MELODY.length];
    if (note > 0) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(note, now);
      gain.gain.setValueAtTime(0.045, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    // 2. 워킹 베이스라인 (트라이앵글 웨이브)
    const bassNote = BASS[bgmStep % BASS.length];
    if (bassNote > 0) {
      const bassOsc = audioCtx.createOscillator();
      const bassGain = audioCtx.createGain();
      bassOsc.type = 'triangle';
      bassOsc.frequency.setValueAtTime(bassNote, now);
      bassGain.gain.setValueAtTime(0.08, now);
      bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      bassOsc.connect(bassGain);
      bassGain.connect(audioCtx.destination);
      bassOsc.start(now);
      bassOsc.stop(now + 0.16);
    }

    bgmStep++;
  }

  function playSfx(type) {
    if (!state.soundEnabled || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.frequency.setValueAtTime(460, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.13);
      } else if (type === 'gold') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587, now);
        osc.frequency.setValueAtTime(987, now + 0.09);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.28);
      } else if (type === 'bomb') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.38);
        gain.gain.setValueAtTime(1.0, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.38);
        osc.start(now);
        osc.stop(now + 0.39);
      }
    } catch(e) {}
  }

  // --- 초대형 고화질 카툰 캐릭터 벡터 에셋 ---
  const MOLE_SVGS = {
    normal: `
      <svg viewBox="0 0 120 130">
        <!-- 두더지 몸체 -->
        <ellipse cx="60" cy="74" rx="44" ry="50" fill="#6d4c41" stroke="#2e1b14" stroke-width="5"/>
        <!-- 귀 -->
        <circle cx="28" cy="38" r="13" fill="#6d4c41" stroke="#2e1b14" stroke-width="4"/>
        <circle cx="28" cy="38" r="7" fill="#f48fb1"/>
        <circle cx="92" cy="38" r="13" fill="#6d4c41" stroke="#2e1b14" stroke-width="4"/>
        <circle cx="92" cy="38" r="7" fill="#f48fb1"/>
        <!-- 주둥이 및 볼터치 -->
        <ellipse cx="60" cy="85" rx="28" ry="20" fill="#d7ccc8" stroke="#2e1b14" stroke-width="4"/>
        <ellipse cx="60" cy="76" rx="9" ry="7" fill="#d81b60"/>
        <circle cx="38" cy="76" r="7" fill="#ffab91" opacity="0.85"/>
        <circle cx="82" cy="76" r="7" fill="#ffab91" opacity="0.85"/>
        <!-- 눈망울 -->
        <ellipse cx="46" cy="56" rx="7" ry="9" fill="#fff" stroke="#2e1b14" stroke-width="3"/>
        <ellipse cx="74" cy="56" rx="7" ry="9" fill="#fff" stroke="#2e1b14" stroke-width="3"/>
        <circle cx="48" cy="56" r="4.5" fill="#000"/>
        <circle cx="76" cy="56" r="4.5" fill="#000"/>
        <circle cx="50" cy="53" r="2" fill="#fff"/>
        <circle cx="78" cy="53" r="2" fill="#fff"/>
        <!-- 앞니 -->
        <rect x="56" y="87" width="8" height="9" rx="2" fill="#fff" stroke="#2e1b14" stroke-width="2"/>
        <!-- 앙증맞은 앞발 -->
        <ellipse cx="30" cy="104" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
        <ellipse cx="90" cy="104" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
      </svg>
    `,
    helmet: `
      <svg viewBox="0 0 120 130">
        <ellipse cx="60" cy="78" rx="44" ry="48" fill="#5d4037" stroke="#2e1b14" stroke-width="5"/>
        <ellipse cx="60" cy="88" rx="28" ry="19" fill="#d7ccc8" stroke="#2e1b14" stroke-width="4"/>
        <ellipse cx="60" cy="80" rx="9" ry="7" fill="#d81b60"/>
        <ellipse cx="46" cy="62" rx="7" ry="8" fill="#fff" stroke="#2e1b14" stroke-width="3"/>
        <ellipse cx="74" cy="62" rx="7" ry="8" fill="#fff" stroke="#2e1b14" stroke-width="3"/>
        <circle cx="48" cy="62" r="4" fill="#000"/>
        <circle cx="76" cy="62" r="4" fill="#000"/>
        <!-- 반짝이는 3D 공사장 안전모 -->
        <path d="M16,48 Q60,12 104,48 Q106,54 60,54 Q14,54 16,48 Z" fill="#ffd600" stroke="#f57f17" stroke-width="5"/>
        <path d="M28,45 Q60,22 92,45" fill="none" stroke="#fff" stroke-width="4" opacity="0.6"/>
        <rect x="50" y="26" width="20" height="18" rx="4" fill="#fff" stroke="#f57f17" stroke-width="3"/>
        <path d="M60,30 L60,40 M54,35 L66,35" stroke="#d50000" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="30" cy="106" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
        <ellipse cx="90" cy="106" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
      </svg>
    `,
    gold: `
      <svg viewBox="0 0 120 130">
        <ellipse cx="60" cy="74" rx="44" ry="50" fill="#ffb300" stroke="#ff6f00" stroke-width="5"/>
        <circle cx="28" cy="38" r="13" fill="#ffb300" stroke="#ff6f00" stroke-width="4"/>
        <circle cx="92" cy="38" r="13" fill="#ffb300" stroke="#ff6f00" stroke-width="4"/>
        <ellipse cx="60" cy="85" rx="28" ry="20" fill="#ffe082" stroke="#ff6f00" stroke-width="4"/>
        <circle cx="60" cy="76" r="7" fill="#e65100"/>
        <!-- 보석 왕관 -->
        <polygon points="34,34 44,10 60,24 76,10 86,34" fill="#ffd700" stroke="#e65100" stroke-width="4"/>
        <circle cx="60" cy="24" r="3.5" fill="#d50000"/>
        <!-- 시크한 블랙 선글라스 -->
        <rect x="32" y="52" width="22" height="16" rx="5" fill="#212121" stroke="#000" stroke-width="2"/>
        <rect x="66" y="52" width="22" height="16" rx="5" fill="#212121" stroke="#000" stroke-width="2"/>
        <line x1="54" y1="58" x2="66" y2="58" stroke="#000" stroke-width="4"/>
        <line x1="36" y1="55" x2="48" y2="63" stroke="#fff" stroke-width="2" opacity="0.6"/>
        <line x1="70" y1="55" x2="82" y2="63" stroke="#fff" stroke-width="2" opacity="0.6"/>
      </svg>
    `,
    bomb: `
      <svg viewBox="0 0 120 130">
        <!-- 활활 타오르는 도화선 불꽃 -->
        <path d="M60,34 Q74,18 88,22" fill="none" stroke="#8d6e63" stroke-width="5" stroke-linecap="round"/>
        <circle cx="90" cy="21" r="9" fill="#ffeb3b"/>
        <polygon points="90,10 96,26 82,16 99,19 86,28" fill="#ff1744"/>
        <!-- 칠흑 같은 메탈 폭탄 바디 -->
        <circle cx="60" cy="76" r="42" fill="#212121" stroke="#000" stroke-width="5"/>
        <ellipse cx="46" cy="62" rx="10" ry="5" fill="#757575" transform="rotate(-30 46 62)"/>
        <!-- 강렬한 해골 마크 -->
        <circle cx="60" cy="76" r="14" fill="#fff"/>
        <circle cx="55" cy="74" r="3.5" fill="#212121"/>
        <circle cx="65" cy="74" r="3.5" fill="#212121"/>
        <rect x="56" y="84" width="8" height="6" rx="1" fill="#fff"/>
      </svg>
    `
  };

  // --- DOM 캐싱 ---
  const gridEl = document.getElementById('field-grid');
  const hammerEl = document.getElementById('custom-hammer');
  const valScore = document.getElementById('val-score');
  const valTimer = document.getElementById('val-timer');
  const valCombo = document.getElementById('val-combo');
  const labelTimer = document.getElementById('label-timer');
  const survivalContainer = document.getElementById('survival-container');
  const survivalBar = document.getElementById('survival-bar');
  const survivalText = document.getElementById('survival-text');
  const startModal = document.getElementById('start-modal');
  const gameoverModal = document.getElementById('gameover-modal');
  const viewport = document.getElementById('game-viewport');
  const audioToggleBtn = document.getElementById('audio-toggle');

  // 오디오 토글
  audioToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    state.soundEnabled = !state.soundEnabled;
    audioToggleBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
    if (!state.soundEnabled) {
      stopBgm();
    } else if (state.isPlaying) {
      startBgm();
    }
  });

  // 그리드 홀 9개 생성
  for (let i = 0; i < 9; i++) {
    const slot = document.createElement('div');
    slot.className = 'hole-slot';
    slot.dataset.index = i;

    slot.innerHTML = `
      <div class="hole-back"></div>
      <div class="mole-wrapper" id="mole-${i}"></div>
      <div class="hole-front"></div>
    `;

    const moleWrapper = slot.querySelector('.mole-wrapper');
    moleWrapper.addEventListener('pointerdown', (e) => onMoleHit(i, e));
    gridEl.appendChild(slot);
  }

  // 커스텀 커서 추적
  window.addEventListener('pointermove', (e) => {
    hammerEl.style.display = 'block';
    hammerEl.style.left = e.clientX + 'px';
    hammerEl.style.top = e.clientY + 'px';
  });

  window.addEventListener('pointerdown', (e) => {
    initAudio();
    hammerEl.classList.remove('swing');
    void hammerEl.offsetWidth;
    hammerEl.classList.add('swing');

    const reticle = document.createElement('div');
    reticle.className = 'hit-crosshair';
    reticle.style.left = e.clientX + 'px';
    reticle.style.top = e.clientY + 'px';
    document.body.appendChild(reticle);
    setTimeout(() => reticle.remove(), 220);
  });

  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-restart').addEventListener('click', startGame);

  function startGame() {
    initAudio();
    startModal.style.display = 'none';
    gameoverModal.style.display = 'none';
    viewport.classList.remove('sudden-flash');

    state.score = 0;
    state.timeLeft = 60;
    state.combo = 0;
    state.maxCombo = 0;
    state.isPlaying = true;
    state.isSuddenDeath = false;
    state.suddenDuration = 0;
    state.currentMaxSurvival = 3.5;
    state.survivalTimer = 3.5;

    for (let i = 0; i < 9; i++) {
      clearHole(i);
    }

    valScore.textContent = '0';
    valTimer.textContent = '60';
    valCombo.textContent = '0';
    labelTimer.textContent = 'TIME';
    survivalContainer.style.display = 'none';

    clearInterval(gameTickInterval);
    clearTimeout(spawnTimeout);

    gameTickInterval = setInterval(gameTick, 100);
    scheduleSpawn();
    startBgm(); // 신나는 배경음악 시작
  }

  function gameTick() {
    if (!state.isPlaying) return;

    if (!state.isSuddenDeath) {
      state.timeLeft -= 0.1;
      valTimer.textContent = Math.max(0, Math.ceil(state.timeLeft));

      if (state.timeLeft <= 0) {
        enterSuddenDeath();
      }
    } else {
      state.suddenDuration += 0.1;
      // 3.5초에서 시작하여 1.0초까지 점진적 단축
      state.currentMaxSurvival = Math.max(1.0, 3.5 - (state.suddenDuration * 0.05));
      state.survivalTimer -= 0.1;

      const pct = Math.max(0, (state.survivalTimer / state.currentMaxSurvival) * 100);
      survivalBar.style.width = pct + '%';
      survivalText.textContent = `COMBO SURVIVAL (${state.survivalTimer.toFixed(1)}s / MAX ${state.currentMaxSurvival.toFixed(1)}s)`;

      if (state.survivalTimer <= 0) {
        endGame('시간 초과! 서든데스 콤보 실패');
      }
    }
  }

  function enterSuddenDeath() {
    state.isSuddenDeath = true;
    state.suddenDuration = 0;
    state.currentMaxSurvival = 3.5;
    state.survivalTimer = 3.5;

    labelTimer.textContent = 'MODE';
    valTimer.textContent = 'SURVIVE';
    survivalContainer.style.display = 'block';
    viewport.classList.add('sudden-flash');
    showPopText(window.innerWidth / 2, window.innerHeight / 2, '⚡ SUDDEN DEATH! ⚡', '#ff1744');
    startBgm(); // 서든데스 빠른 템포로 BGM 재가동
  }

  function getStayDuration() {
    if (state.isSuddenDeath) {
      return 900 + Math.random() * 200;
    }
    const elapsed = 60 - state.timeLeft;
    return Math.max(800, 1600 - (elapsed * 13));
  }

  function getActiveCount() {
    return state.holes.filter(h => h.active).length;
  }

  function scheduleSpawn() {
    if (!state.isPlaying) return;

    if (getActiveCount() < MAX_CONCURRENT_MOLES) {
      spawnMole();
    }

    const nextDelay = state.isSuddenDeath 
      ? 450 + Math.random() * 350
      : Math.max(400, 900 - ((60 - state.timeLeft) * 8));

    spawnTimeout = setTimeout(scheduleSpawn, nextDelay);
  }

  function spawnMole() {
    const freeSlots = [];
    for (let i = 0; i < 9; i++) {
      if (!state.holes[i].active) freeSlots.push(i);
    }
    if (freeSlots.length === 0) return;

    const slotIdx = freeSlots[Math.floor(Math.random() * freeSlots.length)];
    const hole = state.holes[slotIdx];

    const roll = Math.random();
    let type = 'normal';
    if (roll < 0.20) type = 'bomb';
    else if (roll < 0.40) type = 'gold';
    else if (roll < 0.65) type = 'helmet';

    hole.active = true;
    hole.moleType = type;

    const el = document.getElementById(`mole-${slotIdx}`);
    el.innerHTML = MOLE_SVGS[type];
    el.className = 'mole-wrapper up';

    const stayTime = getStayDuration();

    hole.timer = setTimeout(() => {
      if (hole.active) {
        clearHole(slotIdx);
      }
    }, stayTime);
  }

  function clearHole(idx) {
    const hole = state.holes[idx];
    if (hole.timer) clearTimeout(hole.timer);
    hole.active = false;
    hole.moleType = null;
    hole.timer = null;

    const el = document.getElementById(`mole-${idx}`);
    if (el) {
      el.className = 'mole-wrapper';
      el.innerHTML = '';
    }
  }

  function onMoleHit(idx, e) {
    if (!state.isPlaying) return;
    const hole = state.holes[idx];
    if (!hole.active) return;

    e.stopPropagation();
    const type = hole.moleType;
    const el = document.getElementById(`mole-${idx}`);
    const rect = el.getBoundingClientRect();
    const hitX = rect.left + rect.width / 2;
    const hitY = rect.top + rect.height / 3;

    if (type === 'bomb') {
      playSfx('bomb');
      showPopText(hitX, hitY, 'BOOM! -50', '#d50000');
      state.score = Math.max(0, state.score - 50);
      state.combo = 0;
      valCombo.textContent = '0';
      valScore.textContent = state.score;

      clearHole(idx);

      if (state.isSuddenDeath) {
        endGame('폭탄 타격! 서든데스 탈락');
        return;
      }
    } else {
      let pts = 10;
      if (type === 'helmet') pts = 20;
      if (type === 'gold') pts = 40;

      state.combo++;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;

      const comboBonus = Math.min(30, state.combo * 2);
      const totalPts = pts + comboBonus;
      state.score += totalPts;

      valScore.textContent = state.score;
      valCombo.textContent = state.combo;

      if (type === 'gold') {
        playSfx('gold');
        showPopText(hitX, hitY, `JACKPOT! +${totalPts}`, '#ffd700');
      } else {
        playSfx('hit');
        showPopText(hitX, hitY, `+${totalPts}`, '#fff');
      }

      if (state.isSuddenDeath) {
        state.survivalTimer = state.currentMaxSurvival;
      }

      el.classList.add('hit');
      if (hole.timer) clearTimeout(hole.timer);
      setTimeout(() => {
        clearHole(idx);
      }, 100);
    }
  }

  function showPopText(x, y, text, color) {
    const pop = document.createElement('div');
    pop.className = 'comic-pop';
    pop.textContent = text;
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    pop.style.color = color || '#ffeb3b';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 550);
  }

  function endGame(reason) {
    state.isPlaying = false;
    clearInterval(gameTickInterval);
    clearTimeout(spawnTimeout);
    stopBgm();
    viewport.classList.remove('sudden-flash');

    document.getElementById('over-title').textContent = state.isSuddenDeath ? '서든데스 종료!' : 'TIME UP!';
    document.getElementById('over-desc').textContent = reason || '멋진 플레이였습니다!';
    document.getElementById('over-score').textContent = `${state.score}점`;
    document.getElementById('over-maxcombo').textContent = `최고 콤보: ${state.maxCombo}연속`;
    gameoverModal.style.display = 'flex';
  }
})();
</script>
