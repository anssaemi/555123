<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1ㅁ.0, maximum-scale=1.0, user-scalable=no">
<title>Whack-a-Mole Mania Deluxe</title>
<style>
  :root {
    --wood-border: #3e2723;
    --wood-light: #8d6e63;
    --wood-dark: #4e342e;
    --gold: #ffca28;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Arial Black', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #4caf50;
    cursor: default;
  }

  /* 밝고 화사한 햇살 농장 / 채소밭 고화질 사진 배경 */
  #game-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 14px;
    background: 
      radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.15) 0%, rgba(20, 60, 20, 0.4) 100%),
      url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    cursor: none;
    overflow: hidden;
  }

  /* 상단 제어 바 (다시하기, 종료, 사운드) */
  #top-action-bar {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 4px;
    z-index: 50;
  }

  .nav-btn {
    background: linear-gradient(180deg, #6d4c41 0%, #3e2723 100%);
    border: 2px solid #ffca28;
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    padding: 6px 14px;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 4px;
    transition: transform 0.08s ease;
  }

  .nav-btn:active {
    transform: scale(0.94);
  }

  /* 커스텀 해머 커서 */
  #custom-hammer {
    position: fixed;
    width: 90px;
    height: 90px;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-34px, -34px) rotate(0deg);
    transform-origin: 34px 34px;
    transition: transform 0.04s ease-out;
    filter: drop-shadow(4px 10px 8px rgba(0,0,0,0.6));
    display: none;
  }

  #custom-hammer.swing {
    transform: translate(-34px, -34px) rotate(-48deg) scale(0.92);
    transition: transform 0.03s cubic-bezier(0.1, 0.9, 0.2, 1);
  }

  /* 아케이드 HUD 전광판 */
  #hud-board {
    width: 100%;
    max-width: 600px;
    background: linear-gradient(180deg, #5d4037 0%, #3e2723 100%);
    border: 4px solid #ffca28;
    border-radius: 20px;
    box-shadow: 0 10px 22px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.3);
    padding: 8px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    z-index: 20;
  }

  .stat-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.2px;
    color: #ffd54f;
    text-shadow: 1px 1px 2px #000;
  }

  .stat-val {
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    text-shadow: 2px 3px 0px #000;
    line-height: 1.1;
  }

  /* 서든데스 게이지 바 */
  #survival-container {
    width: 100%;
    max-width: 600px;
    height: 24px;
    background: rgba(0,0,0,0.8);
    border: 3px solid #ff3d00;
    border-radius: 14px;
    margin-top: 6px;
    position: relative;
    overflow: hidden;
    display: none;
    box-shadow: 0 0 16px rgba(255, 61, 0, 0.9);
    z-index: 20;
  }

  #survival-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff9100, #ff1744);
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.4);
    transition: width 0.08s linear;
  }

  #survival-text {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 11px;
    font-weight: 900;
    color: #fff;
    text-shadow: 1px 1px 3px #000;
    letter-spacing: 0.5px;
  }

  /* 3x3 잔디밭 필드 */
  #field-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 620px;
    max-height: 600px;
    padding: 6px;
  }

  #field-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 14px;
    width: 100%;
    height: 100%;
  }

  .hole-slot {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 125px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: visible;
  }

  /* 3D 깊이감 흙구멍 & 마운드 */
  .hole-back {
    position: absolute;
    bottom: 4px;
    width: 96%;
    height: 64px;
    background: radial-gradient(ellipse at 50% 65%, #0e0502 0%, #220f06 65%, #3d1c0a 100%);
    border-radius: 50%;
    box-shadow: inset 0 12px 18px rgba(0,0,0,0.98);
    z-index: 1;
  }

  .hole-front {
    position: absolute;
    bottom: -8px;
    width: 108%;
    height: 56px;
    background: radial-gradient(ellipse at 50% 88%, #5d4037 0%, #3e2723 60%, transparent 85%);
    border-bottom: 6px solid #2e7d32;
    border-radius: 50%;
    z-index: 4;
    pointer-events: none;
    box-shadow: 0 6px 12px rgba(0,0,0,0.6);
  }

  /* 크기 대폭 확대된 (150px) 두더지 래퍼 */
  .mole-wrapper {
    position: absolute;
    bottom: 24px;
    width: 150px;
    height: 165px;
    z-index: 2;
    transform: translateY(180px);
    transition: transform 0.12s cubic-bezier(0.18, 0.89, 0.32, 1.25);
    pointer-events: auto;
    cursor: pointer;
  }

  .mole-wrapper.up {
    transform: translateY(-16px);
  }

  .mole-wrapper.hit {
    transform: translateY(35px) scale(0.95, 0.5) !important;
    transition: transform 0.08s ease-in;
    pointer-events: none;
  }

  .mole-wrapper svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 10px 12px rgba(0,0,0,0.6));
  }

  /* 조준 링 및 만화 텍스트 */
  .hit-crosshair {
    position: fixed;
    width: 52px;
    height: 52px;
    border: 3.5px solid #ff1744;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1.4);
    animation: reticlePop 0.22s ease-out forwards;
    z-index: 999;
  }

  @keyframes reticlePop {
    0% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
  }

  .comic-pop {
    position: absolute;
    font-size: 28px;
    font-weight: 900;
    color: #ffeb3b;
    -webkit-text-stroke: 2px #d32f2f;
    text-shadow: 3px 3px 0px #000;
    pointer-events: none;
    z-index: 999;
    animation: popFade 0.55s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
  }

  @keyframes popFade {
    0% { transform: translate(-50%, 0) scale(0.6) rotate(-15deg); opacity: 0; }
    50% { transform: translate(-50%, -45px) scale(1.25) rotate(5deg); opacity: 1; }
    100% { transform: translate(-50%, -75px) scale(1) rotate(0deg); opacity: 0; }
  }

  /* 모달 오버레이 공통 */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.82);
    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* 두더지 필드 위를 침범하지 않고 하단 전용 구역에 배치 */
    align-items: center;
    padding-bottom: 24px;
    z-index: 10000;
    backdrop-filter: blur(5px);
  }

  .card-modal {
    background: linear-gradient(180deg, #fffde7 0%, #fff 100%);
    border: 6px solid #4e342e;
    border-radius: 28px;
    padding: 20px 24px;
    text-align: center;
    max-width: 480px;
    width: 92%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.85);
    max-height: 85vh;
    overflow-y: auto;
  }

  /* 0.6초 쿨다운 적용: 모달 표시 직후 연타로 인한 오클릭 방지 */
  .modal-btn-group {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
    transition: opacity 0.2s ease;
  }

  .btn-cooldown {
    pointer-events: none !important;
    opacity: 0.55 !important;
    filter: grayscale(40%);
    cursor: not-allowed !important;
  }

  .card-modal h1 {
    font-size: 30px;
    margin: 0 0 10px 0;
    color: #e65100;
    text-shadow: 2px 2px 0 #ffe082;
  }

  .card-modal p {
    font-size: 14px;
    color: #4e342e;
    line-height: 1.5;
    margin: 0 0 16px 0;
    font-weight: bold;
  }

  .play-btn {
    background: linear-gradient(180deg, #ff9800 0%, #f57c00 100%);
    border: 4px solid #bf360c;
    border-radius: 32px;
    color: #fff;
    font-size: 18px;
    font-weight: 900;
    padding: 10px 24px;
    cursor: pointer;
    box-shadow: 0 5px 0 #bf360c, 0 8px 14px rgba(0,0,0,0.35);
    transition: all 0.08s ease;
  }

  .play-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #bf360c;
  }

  .secondary-btn {
    background: linear-gradient(180deg, #8d6e63 0%, #5d4037 100%);
    border: 4px solid #3e2723;
    border-radius: 32px;
    color: #fff;
    font-size: 18px;
    font-weight: 900;
    padding: 10px 24px;
    cursor: pointer;
    box-shadow: 0 5px 0 #3e2723, 0 8px 14px rgba(0,0,0,0.35);
    transition: all 0.08s ease;
  }

  .secondary-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #3e2723;
  }

  /* 1~7등 랭킹 보드 테이블 */
  .ranking-table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0 18px;
    font-size: 14px;
  }

  .ranking-table th {
    background: #5d4037;
    color: #ffca28;
    padding: 6px 8px;
    border-radius: 4px;
  }

  .ranking-table td {
    padding: 5px 8px;
    color: #3e2723;
    font-weight: 900;
    border-bottom: 1px solid #d7ccc8;
  }

  .rank-1 { color: #d50000 !important; background: #fff8e1; }
  .rank-2 { color: #e65100 !important; }
  .rank-3 { color: #f57f17 !important; }

  /* 닉네임 입력 폼 */
  .input-name {
    width: 80%;
    padding: 10px 14px;
    font-size: 18px;
    font-weight: 900;
    text-align: center;
    border: 3px solid #ff9800;
    border-radius: 14px;
    margin-bottom: 16px;
    outline: none;
  }

  .sudden-flash {
    animation: suddenRed 0.6s infinite alternate;
  }

  @keyframes suddenRed {
    0% { box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.4); }
    100% { box-shadow: inset 0 0 80px rgba(255, 0, 0, 0.95); }
  }
</style>
</head>
<body>

<div id="game-viewport">
  <!-- 상단 컨트롤 버튼 (다시하기, 종료, 사운드) -->
  <div id="top-action-bar">
    <button class="nav-btn" id="btn-top-restart">다시하기 🔄</button>
    <button class="nav-btn" id="btn-top-quit">종료 🛑</button>
    <button class="nav-btn" id="audio-toggle">🔊</button>
  </div>

  <!-- 메인 HUD 전광판 -->
  <div id="hud-board">
    <div class="stat-badge">
      <div class="stat-label">SCORE</div>
      <div class="stat-val" id="val-score">0</div>
    </div>
    <div class="stat-badge">
      <div class="stat-label" id="label-timer">TIME</div>
      <div class="stat-val" id="val-timer">30</div>
    </div>
    <div class="stat-badge">
      <div class="stat-label">COMBO</div>
      <div class="stat-val" id="val-combo">0</div>
    </div>
  </div>

  <!-- 서든데스 게이지 바 -->
  <div id="survival-container">
    <div id="survival-bar"></div>
    <div id="survival-text">COMBO SURVIVAL (MAX 2.0s)</div>
  </div>

  <!-- 3x3 잔디밭 필드 -->
  <div id="field-container">
    <div id="field-grid">
      <!-- 9개 슬롯 생성 -->
    </div>
  </div>
</div>

<!-- 커스텀 해머 커서 -->
<div id="custom-hammer">
  <svg viewBox="0 0 100 100" width="100%" height="100%">
    <rect x="28" y="28" width="14" height="66" rx="6" fill="#8d6e63" stroke="#3e2723" stroke-width="3.5" transform="rotate(45 35 61)"/>
    <rect x="14" y="14" width="40" height="40" rx="9" fill="#546e7a" stroke="#263238" stroke-width="4.5" transform="rotate(-45 34 34)"/>
    <rect x="18" y="18" width="32" height="12" rx="4" fill="#90a4ae" transform="rotate(-45 34 34)"/>
    <circle cx="34" cy="34" r="4" fill="#ff1744"/>
  </svg>
</div>

<!-- 시작 모달 -->
<div id="start-modal" class="modal-overlay">
  <div class="card-modal">
    <h1>두더지 매니아 DX</h1>
    <p>
      ⏱️ <strong>제한 시간 30초!</strong><br>
      💥 모든 두더지는 <strong>1방에 처치!</strong><br>
      💣 <strong>폭탄</strong>을 치면 콤보 리셋 및 즉시 감점!<br>
      ⚡ <strong>30초 후 서든데스</strong>: 콤보 타이머가 <strong>2.0s ➔ 0.4s</strong>로 단축됩니다!
    </p>
    <button class="play-btn" id="btn-start">게임 시작! 🔨</button>
  </div>
</div>

<!-- 이름 입력 모달 (TOP 7 진입 시) -->
<div id="record-modal" class="modal-overlay" style="display:none;">
  <div class="card-modal">
    <h1 style="color:#d84315;">🎉 랭킹 진입! 🎉</h1>
    <p>TOP 7 명예의 전당에 올랐습니다!<br>이름(닉네임)을 입력하세요.</p>
    <div style="font-size: 26px; font-weight:900; color:#e65100; margin-bottom: 12px;" id="record-score">0점</div>
    <input type="text" id="player-name-input" class="input-name" maxlength="8" placeholder="이름 (최대 8글자)">
    <div class="modal-btn-group">
      <button class="play-btn" id="btn-save-record">기록 등록 🏆</button>
      <button class="secondary-btn" id="btn-skip-to-main">메인으로 🏠</button>
    </div>
  </div>
</div>

<!-- 게임오버 & 랭킹 모달 -->
<div id="gameover-modal" class="modal-overlay" style="display:none;">
  <div class="card-modal">
    <h1 id="over-title">GAME OVER</h1>
    <div style="font-size: 26px; font-weight:900; color:#d84315;" id="over-score">0점</div>
    <div style="font-size: 14px; color:#5d4037; margin-bottom: 10px; font-weight:bold;" id="over-maxcombo">최고 콤보: 0연속</div>

    <!-- 1~7등 랭킹 테이블 -->
    <div style="font-weight: 900; color:#5d4037; font-size:15px; margin-top:8px;">🏆 명예의 전당 (TOP 7) 🏆</div>
    <table class="ranking-table">
      <thead>
        <tr>
          <th>순위</th>
          <th>이름</th>
          <th>점수</th>
          <th>콤보</th>
        </tr>
      </thead>
      <tbody id="ranking-body">
        <!-- 순위 자동 채움 -->
      </tbody>
    </table>

    <div class="modal-btn-group">
      <button class="play-btn" id="btn-restart">다시 하기 🔄</button>
      <button class="secondary-btn" id="btn-go-main">메인으로 🏠</button>
    </div>
  </div>
</div>

<script>
(() => {
  const GAME_DURATION = 30; // 30초 설정
  const MAX_CONCURRENT_MOLES = 4; // 최대 표시 갯수 4개 엄격 제한
  const STORAGE_KEY = 'whack_mole_top7_scores';

  const state = {
    score: 0,
    timeLeft: GAME_DURATION,
    combo: 0,
    maxCombo: 0,
    isPlaying: false,
    isSuddenDeath: false,
    suddenDuration: 0,
    currentMaxSurvival: 2.0,
    survivalTimer: 2.0,
    soundEnabled: true,
    holes: Array(9).fill(null).map(() => ({ active: false, moleType: null, timer: null }))
  };

  let gameTickInterval = null;
  let spawnTimeout = null;

  // --- 1~7등 랭킹 기본값 & 로드 시스템 ---
  function getLeaderboard() {
    const defaultData = [
      { name: '두더지헌터', score: 480, combo: 24 },
      { name: '망치마스터', score: 420, combo: 20 },
      { name: '황금황제', score: 360, combo: 18 },
      { name: '스피드왕', score: 310, combo: 15 },
      { name: '빛의손가락', score: 260, combo: 12 },
      { name: '아케이드장인', score: 210, combo: 10 },
      { name: '풍선껌', score: 160, combo: 8 }
    ];
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) return JSON.parse(stored);
    } catch(e) {}
    return defaultData;
  }

  function saveLeaderboard(board) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(board));
    } catch(e) {}
  }

  function checkIsTop7(score) {
    const list = getLeaderboard();
    if (list.length < 7) return true;
    return score > list[list.length - 1].score;
  }

  function renderLeaderboardTable() {
    const list = getLeaderboard();
    const tbody = document.getElementById('ranking-body');
    tbody.innerHTML = '';
    list.slice(0, 7).forEach((item, idx) => {
      const tr = document.createElement('tr');
      if (idx === 0) tr.className = 'rank-1';
      else if (idx === 1) tr.className = 'rank-2';
      else if (idx === 2) tr.className = 'rank-3';

      tr.innerHTML = `
        <td>${idx + 1}등</td>
        <td>${item.name}</td>
        <td>${item.score}점</td>
        <td>${item.combo}연속</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- Web Audio 사운드 & 8비트 BGM ---
  let audioCtx = null;
  let bgmInterval = null;
  let bgmStep = 0;

  const MELODY = [
    261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63, 0,
    293.66, 349.23, 440.00, 587.33, 440.00, 349.23, 293.66, 0,
    329.63, 392.00, 493.88, 659.25, 493.88, 392.00, 329.63, 0,
    392.00, 329.63, 293.66, 261.63, 293.66, 329.63, 261.63, 0
  ];
  const BASS = [
    130.81, 0, 130.81, 0, 146.83, 0, 146.83, 0,
    164.81, 0, 164.81, 0, 130.81, 0, 196.00, 0
  ];

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function startBgm() {
    stopBgm();
    if (!state.soundEnabled) return;
    initAudio();
    bgmStep = 0;
    const tempo = state.isSuddenDeath ? 120 : 155;
    bgmInterval = setInterval(playBgmStep, tempo);
  }

  function stopBgm() {
    if (bgmInterval) {
      clearInterval(bgmInterval);
      bgmInterval = null;
    }
  }

  function playBgmStep() {
    if (!state.isPlaying || !state.soundEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;

    const note = MELODY[bgmStep % MELODY.length];
    if (note > 0) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(note, now);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    const bassNote = BASS[bgmStep % BASS.length];
    if (bassNote > 0) {
      const bassOsc = audioCtx.createOscillator();
      const bassGain = audioCtx.createGain();
      bassOsc.type = 'triangle';
      bassOsc.frequency.setValueAtTime(bassNote, now);
      bassGain.gain.setValueAtTime(0.07, now);
      bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      bassOsc.connect(bassGain);
      bassGain.connect(audioCtx.destination);
      bassOsc.start(now);
      bassOsc.stop(now + 0.16);
    }

    bgmStep++;
  }

  function playSfx(type) {
    if (!state.soundEnabled || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.frequency.setValueAtTime(460, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.13);
      } else if (type === 'gold') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587, now);
        osc.frequency.setValueAtTime(987, now + 0.09);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.28);
      } else if (type === 'bomb') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.38);
        gain.gain.setValueAtTime(1.0, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.38);
        osc.start(now);
        osc.stop(now + 0.39);
      }
    } catch(e) {}
  }

  // --- 초대형 (150px) 고화질 벡터 에셋 ---
  const MOLE_SVGS = {
    normal: `
      <svg viewBox="0 0 120 130">
        <ellipse cx="60" cy="74" rx="44" ry="50" fill="#6d4c41" stroke="#2e1b14" stroke-width="5"/>
        <circle cx="28" cy="38" r="13" fill="#6d4c41" stroke="#2e1b14" stroke-width="4"/>
        <circle cx="28" cy="38" r="7" fill="#f48fb1"/>
        <circle cx="92" cy="38" r="13" fill="#6d4c41" stroke="#2e1b14" stroke-width="4"/>
        <circle cx="92" cy="38" r="7" fill="#f48fb1"/>
        <ellipse cx="60" cy="85" rx="28" ry="20" fill="#d7ccc8" stroke="#2e1b14" stroke-width="4"/>
        <ellipse cx="60" cy="76" rx="9" ry="7" fill="#d81b60"/>

        <ellipse cx="46" cy="56" rx="7" ry="9" fill="#fff" stroke="#2e1b14" stroke-width="3"/>
        <ellipse cx="74" cy="56" rx="7" ry="9" fill="#fff" stroke="#2e1b14" stroke-width="3"/>
        <circle cx="48" cy="56" r="4.5" fill="#000"/>
        <circle cx="76" cy="56" r="4.5" fill="#000"/>
        <circle cx="50" cy="53" r="2" fill="#fff"/>
        <circle cx="78" cy="53" r="2" fill="#fff"/>
        <rect x="56" y="87" width="8" height="9" rx="2" fill="#fff" stroke="#2e1b14" stroke-width="2"/>
        <ellipse cx="30" cy="104" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
        <ellipse cx="90" cy="104" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
      </svg>
    `,
    helmet: `
      <svg viewBox="0 0 120 130">
        <ellipse cx="60" cy="78" rx="44" ry="48" fill="#5d4037" stroke="#2e1b14" stroke-width="5"/>

        <ellipse cx="60" cy="80" rx="9" ry="7" fill="#d81b60"/>

        <ellipse cx="74" cy="62" rx="7" ry="8" fill="#fff" stroke="#2e1b14" stroke-width="3"/>

        <circle cx="76" cy="62" r="4" fill="#000"/>
        <path d="M16,48 Q60,12 104,48 Q106,54 60,54 Q14,54 16,48 Z" fill="#ffd600" stroke="#f57f17" stroke-width="5"/>
        <path d="M28,45 Q60,22 92,45" fill="none" stroke="#fff" stroke-width="4" opacity="0.6"/>

        <path d="M60,30 L60,40 M54,35 L66,35" stroke="#d50000" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="30" cy="106" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
        <ellipse cx="90" cy="106" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
      </svg>
    `,
    gold: `
      <svg viewBox="0 0 120 130">
        <ellipse cx="60" cy="74" rx="44" ry="50" fill="#ffb300" stroke="#ff6f00" stroke-width="5"/>
        <circle cx="28" cy="38" r="13" fill="#ffb300" stroke="#ff6f00" stroke-width="4"/>
        <circle cx="92" cy="38" r="13" fill="#ffb300" stroke="#ff6f00" stroke-width="4"/>
        <ellipse cx="60" cy="85" rx="28" ry="20" fill="#ffe082" stroke="#ff6f00" stroke-width="4"/>
        <circle cx="60" cy="76" r="7" fill="#e65100"/>
        <polygon points="34,34 44,10 60,24 76,10 86,34" fill="#ffd700" stroke="#e65100" stroke-width="4"/>
        <circle cx="60" cy="24" r="3.5" fill="#d50000"/>
        <rect x="32" y="52" width="22" height="16" rx="5" fill="#212121" stroke="#000" stroke-width="2"/>
        <rect x="66" y="52" width="22" height="16" rx="5" fill="#212121" stroke="#000" stroke-width="2"/>
        <line x1="54" y1="58" x2="66" y2="58" stroke="#000" stroke-width="4"/>
      </svg>
    `,
    bomb: `
      <svg viewBox="0 0 120 130">
        <path d="M60,34 Q74,18 88,22" fill="none" stroke="#8d6e63" stroke-width="5" stroke-linecap="round"/>
        <circle cx="90" cy="21" r="9" fill="#ffeb3b"/>
        <polygon points="90,10 96,26 82,16 99,19 86,28" fill="#ff1744"/>
        <circle cx="60" cy="76" r="44" fill="#212121" stroke="#000" stroke-width="5"/>
        <ellipse cx="46" cy="62" rx="10" ry="5" fill="#757575" transform="rotate(-30 46 62)"/>
        <circle cx="60" cy="76" r="15" fill="#fff"/>
        <circle cx="55" cy="74" r="3.5" fill="#212121"/>
        <circle cx="65" cy="74" r="3.5" fill="#212121"/>
        <rect x="56" y="84" width="8" height="6" rx="1" fill="#fff"/>
      </svg>
    `
  };

  // --- DOM 요소 캐싱 ---
  const gridEl = document.getElementById('field-grid');
  const hammerEl = document.getElementById('custom-hammer');
  const valScore = document.getElementById('val-score');
  const valTimer = document.getElementById('val-timer');
  const valCombo = document.getElementById('val-combo');
  const labelTimer = document.getElementById('label-timer');
  const survivalContainer = document.getElementById('survival-container');
  const survivalBar = document.getElementById('survival-bar');
  const survivalText = document.getElementById('survival-text');
  const startModal = document.getElementById('start-modal');
  const recordModal = document.getElementById('record-modal');
  const gameoverModal = document.getElementById('gameover-modal');
  const viewport = document.getElementById('game-viewport');
  const audioToggleBtn = document.getElementById('audio-toggle');
  const playerNameInput = document.getElementById('player-name-input');

  function returnToMainMenu() {
    state.isPlaying = false;
    clearInterval(gameTickInterval);
    clearTimeout(spawnTimeout);
    stopBgm();
    viewport.classList.remove('sudden-flash');
    for (let i = 0; i < 9; i++) clearHole(i);

    recordModal.style.display = 'none';
    gameoverModal.style.display = 'none';
    startModal.style.display = 'flex';
  }

  // 모달 오픈 시 0.6초 쿨다운을 적용해 연타 중 실수 클릭 방지
  function applyButtonCooldown(containerSelector) {
    const group = document.querySelector(containerSelector);
    if (!group) return;
    group.classList.add('btn-cooldown');
    setTimeout(() => {
      group.classList.remove('btn-cooldown');
    }, 600);
  }

  // 오디오 토글
  audioToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    state.soundEnabled = !state.soundEnabled;
    audioToggleBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
    if (!state.soundEnabled) stopBgm();
    else if (state.isPlaying) startBgm();
  });

  // 상단 바 버튼 바인딩
  document.getElementById('btn-top-restart').addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
  });

  document.getElementById('btn-top-quit').addEventListener('click', (e) => {
    e.stopPropagation();
    returnToMainMenu();
  });

  // 필드 홀 9개 초기화
  for (let i = 0; i < 9; i++) {
    const slot = document.createElement('div');
    slot.className = 'hole-slot';
    slot.dataset.index = i;

    slot.innerHTML = `
      <div class="hole-back"></div>
      <div class="mole-wrapper" id="mole-${i}"></div>
      <div class="hole-front"></div>
    `;

    const moleWrapper = slot.querySelector('.mole-wrapper');
    moleWrapper.addEventListener('pointerdown', (e) => onMoleHit(i, e));
    gridEl.appendChild(slot);
  }

  // 우클릭 메뉴 차단 (게임 화면 전체 및 필드 영역)
  window.addEventListener('contextmenu', (e) => {
    e.preventDefault();
  });

  // 커스텀 커서 추적
  window.addEventListener('pointermove', (e) => {
    hammerEl.style.display = 'block';
    hammerEl.style.left = e.clientX + 'px';
    hammerEl.style.top = e.clientY + 'px';
  });

  window.addEventListener('pointerdown', (e) => {
    // 마우스 우클릭 등 보조 버튼 클릭 무시 (주 버튼 e.button === 0 만 허용)
    if (e.button !== undefined && e.button !== 0) return;

    initAudio();
    hammerEl.classList.remove('swing');
    void hammerEl.offsetWidth;
    hammerEl.classList.add('swing');

    const reticle = document.createElement('div');
    reticle.className = 'hit-crosshair';
    reticle.style.left = e.clientX + 'px';
    reticle.style.top = e.clientY + 'px';
    document.body.appendChild(reticle);
    setTimeout(() => reticle.remove(), 220);
  });

  // 게임 시작
  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-restart').addEventListener('click', startGame);
  document.getElementById('btn-go-main').addEventListener('click', returnToMainMenu);
  document.getElementById('btn-skip-to-main').addEventListener('click', returnToMainMenu);

  function startGame() {
    initAudio();
    startModal.style.display = 'none';
    recordModal.style.display = 'none';
    gameoverModal.style.display = 'none';
    viewport.classList.remove('sudden-flash');

    state.score = 0;
    state.timeLeft = GAME_DURATION;
    state.combo = 0;
    state.maxCombo = 0;
    state.isPlaying = true;
    state.isSuddenDeath = false;
    state.suddenDuration = 0;
    state.currentMaxSurvival = 2.0;
    state.survivalTimer = 2.0;

    for (let i = 0; i < 9; i++) clearHole(i);

    valScore.textContent = '0';
    valTimer.textContent = GAME_DURATION;
    valCombo.textContent = '0';
    labelTimer.textContent = 'TIME';
    survivalContainer.style.display = 'none';

    clearInterval(gameTickInterval);
    clearTimeout(spawnTimeout);

    gameTickInterval = setInterval(gameTick, 100);
    // 스타트 버튼 누른 후 0.5초(500ms) 뒤부터 두더지 등장
    spawnTimeout = setTimeout(scheduleSpawn, 500);
    startBgm();
  }

  // 0.1초 루프 (30초 카운트다운 & 서든데스)
  function gameTick() {
    if (!state.isPlaying) return;

    if (!state.isSuddenDeath) {
      state.timeLeft -= 0.1;
      valTimer.textContent = Math.max(0, Math.ceil(state.timeLeft));

      if (state.timeLeft <= 0) {
        enterSuddenDeath();
      }
    } else {
      state.suddenDuration += 0.1;
      // [서든데스 게이지 감축 로직] 2.0초 시작 -> 최종 0.4초까지 감축 (초당 약 0.05초씩 단축)
      state.currentMaxSurvival = Math.max(0.4, 2.0 - (state.suddenDuration * 0.05));
      state.survivalTimer -= 0.1;

      const pct = Math.max(0, (state.survivalTimer / state.currentMaxSurvival) * 100);
      survivalBar.style.width = pct + '%';
      survivalText.textContent = `COMBO SURVIVAL (${state.survivalTimer.toFixed(1)}s / MAX ${state.currentMaxSurvival.toFixed(1)}s)`;

      if (state.survivalTimer <= 0) {
        endGame('시간 초과! 서든데스 콤보 실패');
      }
    }
  }

  function enterSuddenDeath() {
    state.isSuddenDeath = true;
    state.suddenDuration = 0;
    state.currentMaxSurvival = 2.0;
    state.survivalTimer = 2.0;

    labelTimer.textContent = 'MODE';
    valTimer.textContent = 'SURVIVE';
    survivalContainer.style.display = 'block';
    viewport.classList.add('sudden-flash');
    showPopText(window.innerWidth / 2, window.innerHeight / 2, '⚡ SUDDEN DEATH! ⚡', '#ff1744');
    startBgm();
  }

  function getStayDuration() {
    if (state.isSuddenDeath) {
      return 750 + Math.random() * 200;
    }
    const elapsed = GAME_DURATION - state.timeLeft;
    return Math.max(750, 1500 - (elapsed * 25));
  }

  function getActiveCount() {
    return state.holes.filter(h => h.active).length;
  }

  function scheduleSpawn() {
    if (!state.isPlaying) return;

    // 최대 4마리 초과 금지 가드
    if (getActiveCount() < MAX_CONCURRENT_MOLES) {
      spawnMole();
    }

    const nextDelay = state.isSuddenDeath 
      ? 260 + Math.random() * 220
      : Math.max(280, 700 - ((GAME_DURATION - state.timeLeft) * 14));

    spawnTimeout = setTimeout(scheduleSpawn, nextDelay);
  }

  function spawnMole() {
    if (getActiveCount() >= MAX_CONCURRENT_MOLES) return;

    const freeSlots = [];
    for (let i = 0; i < 9; i++) {
      if (!state.holes[i].active) freeSlots.push(i);
    }
    if (freeSlots.length === 0) return;

    const slotIdx = freeSlots[Math.floor(Math.random() * freeSlots.length)];
    const hole = state.holes[slotIdx];

    const roll = Math.random();
    let type = 'normal';
    if (roll < 0.20) type = 'bomb';
    else if (roll < 0.40) type = 'gold';
    else if (roll < 0.65) type = 'helmet';

    hole.active = true;
    hole.moleType = type;

    const el = document.getElementById(`mole-${slotIdx}`);
    el.innerHTML = MOLE_SVGS[type];
    el.className = 'mole-wrapper up';

    const stayTime = getStayDuration();

    hole.timer = setTimeout(() => {
      if (hole.active) clearHole(slotIdx);
    }, stayTime);
  }

  function clearHole(idx) {
    const hole = state.holes[idx];
    if (hole.timer) clearTimeout(hole.timer);
    hole.active = false;
    hole.moleType = null;
    hole.timer = null;

    const el = document.getElementById(`mole-${idx}`);
    if (el) {
      el.className = 'mole-wrapper';
      el.innerHTML = '';
    }
  }

  function onMoleHit(idx, e) {
    if (!state.isPlaying) return;
    // 마우스 우클릭 등 보조 버튼은 타격으로 인정하지 않음
    if (e.button !== undefined && e.button !== 0) return;

    const hole = state.holes[idx];
    if (!hole.active) return;

    e.stopPropagation();
    const type = hole.moleType;
    const el = document.getElementById(`mole-${idx}`);
    const rect = el.getBoundingClientRect();
    const hitX = rect.left + rect.width / 2;
    const hitY = rect.top + rect.height / 3;

    if (type === 'bomb') {
      playSfx('bomb');
      showPopText(hitX, hitY, 'BOOM! -50', '#d50000');
      state.score = Math.max(0, state.score - 50);
      state.combo = 0;
      valCombo.textContent = '0';
      valScore.textContent = state.score;

      clearHole(idx);

      if (state.isSuddenDeath) {
        endGame('폭탄 타격! 서든데스 탈락');
        return;
      }
    } else {
      // 1타 처치
      let pts = 10;
      if (type === 'helmet') pts = 20;
      if (type === 'gold') pts = 40;

      state.combo++;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;

      const comboBonus = Math.min(30, state.combo * 2);
      const totalPts = pts + comboBonus;
      state.score += totalPts;

      valScore.textContent = state.score;
      valCombo.textContent = state.combo;

      if (type === 'gold') {
        playSfx('gold');
        showPopText(hitX, hitY, `JACKPOT! +${totalPts}`, '#ffd700');
      } else {
        playSfx('hit');
        showPopText(hitX, hitY, `+${totalPts}`, '#fff');
      }

      if (state.isSuddenDeath) {
        state.survivalTimer = state.currentMaxSurvival;
      }

      el.classList.add('hit');
      if (hole.timer) clearTimeout(hole.timer);
      setTimeout(() => clearHole(idx), 100);
    }
  }

  function showPopText(x, y, text, color) {
    const pop = document.createElement('div');
    pop.className = 'comic-pop';
    pop.textContent = text;
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    pop.style.color = color || '#ffeb3b';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 550);
  }

  // --- 게임 종료 및 랭킹 처리 ---
  function endGame(reason) {
    state.isPlaying = false;
    clearInterval(gameTickInterval);
    clearTimeout(spawnTimeout);
    stopBgm();
    viewport.classList.remove('sudden-flash');

    if (checkIsTop7(state.score)) {
      // 1~7등 진입 시 이름 입력 모달 표출
      document.getElementById('record-score').textContent = `${state.score}점 (최대콤보 ${state.maxCombo}연속)`;
      playerNameInput.value = '';
      recordModal.style.display = 'flex';
      applyButtonCooldown('#record-modal .modal-btn-group');
      setTimeout(() => playerNameInput.focus(), 650);
    } else {
      showFinalGameOver(reason);
    }
  }

  // 이름 저장 버튼 이벤트
  document.getElementById('btn-save-record').addEventListener('click', () => {
    let name = playerNameInput.value.trim() || '플레이어';
    if (name.length > 8) name = name.substring(0, 8);

    const list = getLeaderboard();
    list.push({ name: name, score: state.score, combo: state.maxCombo });
    // 점수 내림차순 정렬 후 상위 7개만 유지
    list.sort((a, b) => b.score - a.score);
    const top7 = list.slice(0, 7);
    saveLeaderboard(top7);

    recordModal.style.display = 'none';
    showFinalGameOver('새로운 랭킹 기록이 등록되었습니다!');
  });

  function showFinalGameOver(reason) {
    document.getElementById('over-title').textContent = state.isSuddenDeath ? '서든데스 종료!' : 'TIME UP!';
    document.getElementById('over-score').textContent = `${state.score}점`;
    document.getElementById('over-maxcombo').textContent = `최고 콤보: ${state.maxCombo}연속`;
    renderLeaderboardTable();
    gameoverModal.style.display = 'flex';
    applyButtonCooldown('#gameover-modal .modal-btn-group');
  }
})();
</script>
