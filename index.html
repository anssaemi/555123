<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whack-a-Mole Mania Deluxe</title>
<style>
  :root {
    --gold: #ffca28;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Arial Black', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1b5e20;
    cursor: default;
  }

  /* 고화질 밝은 농장/채소밭 실사 배경 */
  #game-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background-color: #388e3c;
    background-image: 
      linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)),
      url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1920&q=80');
    background-size: cover;
    background-position: center bottom;
    transition: box-shadow 0.3s ease;
  }

  /* 상단 내비게이션 컨트롤 바 */
  #top-ctrl-bar {
    width: 100%;
    max-width: 580px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    z-index: 30;
  }

  .ctrl-btn {
    background: linear-gradient(180deg, #ffb300 0%, #f57f17 100%);
    border: 2.5px solid #fff;
    border-radius: 18px;
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    padding: 6px 14px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    text-shadow: 1px 1px 2px #000;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .ctrl-btn:active {
    transform: translateY(2px);
  }

  #audio-toggle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  /* 목재 아케이드 전광판 HUD */
  #hud-board {
    width: 100%;
    max-width: 580px;
    background: linear-gradient(180deg, #6d4c41 0%, #4e342e 70%, #3e2723 100%);
    border: 4px solid #ffca28;
    border-radius: 18px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.6), inset 0 3px 5px rgba(255,255,255,0.3);
    padding: 8px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    z-index: 20;
  }

  .stat-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #ffd54f;
    text-shadow: 1px 1px 2px #000;
  }

  .stat-val {
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    text-shadow: 2px 2px 0px #000;
    line-height: 1.1;
  }

  /* 서든데스 게이지 바 */
  #survival-container {
    width: 100%;
    max-width: 580px;
    height: 22px;
    background: rgba(0,0,0,0.8);
    border: 2.5px solid #ff3d00;
    border-radius: 12px;
    margin-top: 5px;
    position: relative;
    overflow: hidden;
    display: none;
    box-shadow: 0 0 14px rgba(255, 61, 0, 0.9);
    z-index: 20;
  }

  #survival-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff9100, #ff1744);
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.4);
    transition: width 0.08s linear;
  }

  #survival-text {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 11px;
    font-weight: 900;
    color: #fff;
    text-shadow: 1px 1px 2px #000;
  }

  /* 3x3 잔디 필드 그리드 */
  #field-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 620px;
    max-height: 580px;
    padding: 4px;
    z-index: 10;
  }

  #field-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 14px;
    width: 100%;
    height: 100%;
  }

  .hole-slot {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 120px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .hole-back {
    position: absolute;
    bottom: 4px;
    width: 95%;
    height: 56px;
    background: radial-gradient(ellipse at 50% 60%, #150904 0%, #2e170b 60%, #4e2912 100%);
    border-radius: 50%;
    box-shadow: inset 0 10px 16px rgba(0,0,0,0.95);
    z-index: 1;
  }

  .hole-front {
    position: absolute;
    bottom: -6px;
    width: 108%;
    height: 50px;
    background: radial-gradient(ellipse at 50% 85%, #5d4037 0%, #3e2723 65%, transparent 85%);
    border-bottom: 7px solid #2e7d32;
    border-radius: 50%;
    z-index: 4;
    pointer-events: none;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
  }

  /* 두더지 래퍼 */
  .mole-wrapper {
    position: absolute;
    bottom: 20px;
    width: 130px;
    height: 146px;
    z-index: 2;
    transform: translateY(165px);
    transition: transform 0.12s cubic-bezier(0.18, 0.89, 0.32, 1.25);
    pointer-events: auto;
    cursor: pointer;
  }

  .mole-wrapper.up {
    transform: translateY(-8px);
  }

  .mole-wrapper.hit {
    transform: translateY(30px) scale(0.95, 0.55) !important;
    transition: transform 0.08s ease-in;
    pointer-events: none;
  }

  .mole-wrapper svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,0.5));
  }

  /* 타격 시 두더지 머리 위에만 나타나는 스매시 해머 */
  .hammer-smash {
    position: absolute;
    top: -45px;
    left: 20px;
    width: 95px;
    height: 95px;
    pointer-events: none;
    z-index: 99;
    transform-origin: 30px 30px;
    animation: hammerSmashAnim 0.22s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    filter: drop-shadow(3px 8px 6px rgba(0,0,0,0.6));
  }

  @keyframes hammerSmashAnim {
    0% { transform: rotate(40deg) translateY(-20px) scale(1.15); opacity: 0; }
    25% { opacity: 1; }
    55% { transform: rotate(-38deg) translateY(0px) scale(1); opacity: 1; }
    100% { transform: rotate(-45deg) translateY(10px) scale(0.9); opacity: 0; }
  }

  /* 만화 팝업 텍스트 */
  .comic-pop {
    position: absolute;
    font-size: 26px;
    font-weight: 900;
    color: #ffeb3b;
    -webkit-text-stroke: 1.8px #d32f2f;
    text-shadow: 2px 2px 0px #000;
    pointer-events: none;
    z-index: 999;
    animation: popFade 0.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
  }

  @keyframes popFade {
    0% { transform: translate(-50%, 0) scale(0.6) rotate(-12deg); opacity: 0; }
    50% { transform: translate(-50%, -40px) scale(1.2) rotate(4deg); opacity: 1; }
    100% { transform: translate(-50%, -65px) scale(1) rotate(0deg); opacity: 0; }
  }

  /* 3초 카운트다운 오버레이 */
  #countdown-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    backdrop-filter: blur(2px);
  }

  #countdown-num {
    font-size: 110px;
    font-weight: 900;
    color: #ffd600;
    -webkit-text-stroke: 4px #e65100;
    text-shadow: 0 10px 25px rgba(0,0,0,0.8);
    animation: countScale 0.85s cubic-bezier(0.1, 0.9, 0.2, 1);
  }

  @keyframes countScale {
    0% { transform: scale(0.2); opacity: 0; }
    50% { transform: scale(1.25); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 모달 오버레이 */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.72);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 24px;
    z-index: 10000;
    backdrop-filter: blur(4px);
  }

  .card-modal {
    background: linear-gradient(180deg, #fffde7 0%, #ffffff 100%);
    border: 5px solid #4e342e;
    border-radius: 24px;
    padding: 20px 24px;
    text-align: center;
    max-width: 440px;
    width: 92%;
    box-shadow: 0 16px 36px rgba(0,0,0,0.85);
  }

  .card-modal h1 {
    font-size: 26px;
    margin: 0 0 8px 0;
    color: #e65100;
    text-shadow: 1px 1px 0 #ffe082;
  }

  .card-modal p {
    font-size: 13px;
    color: #4e342e;
    line-height: 1.5;
    margin: 0 0 14px 0;
    font-weight: bold;
  }

  .modal-btn-group {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
  }

  .play-btn {
    background: linear-gradient(180deg, #ff9800 0%, #f57c00 100%);
    border: 3px solid #bf360c;
    border-radius: 26px;
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    padding: 10px 24px;
    cursor: pointer;
    box-shadow: 0 5px 0 #bf360c, 0 8px 12px rgba(0,0,0,0.3);
    transition: all 0.08s ease;
  }

  .play-btn.sec {
    background: linear-gradient(180deg, #78909c 0%, #455a64 100%);
    border-color: #263238;
    box-shadow: 0 5px 0 #263238;
  }

  .play-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #bf360c;
  }

  .disabled-cooldown {
    pointer-events: none !important;
    opacity: 0.65;
  }

  /* 랭킹 테이블 */
  .rank-table-wrap {
    max-height: 155px;
    overflow-y: auto;
    margin: 8px 0 12px 0;
    border-radius: 10px;
    border: 2px solid #bcaaa4;
    background: #efebe9;
  }

  .rank-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .rank-table th {
    background: #6d4c41;
    color: #fff;
    padding: 5px;
    font-size: 11px;
  }

  .rank-table td {
    padding: 5px 6px;
    border-bottom: 1px solid #d7ccc8;
    color: #3e2723;
    font-weight: bold;
  }

  .rank-table tr:nth-child(even) { background: #fbe9e7; }
  .rank-table tr.top1 td { color: #d84315; }

  /* 닉네임 입력 인풋 */
  .name-input {
    width: 80%;
    padding: 8px 12px;
    font-size: 18px;
    font-weight: 900;
    text-align: center;
    border: 3px solid #ff9800;
    border-radius: 12px;
    outline: none;
    margin-bottom: 10px;
    background: #fff;
  }

  .sudden-flash {
    animation: suddenRed 0.6s infinite alternate;
  }

  @keyframes suddenRed {
    0% { box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.3); }
    100% { box-shadow: inset 0 0 70px rgba(255, 0, 0, 0.85); }
  }
</style>
</head>
<body>

<div id="game-viewport">
  <!-- 상단 컨트롤 버튼 바 -->
  <div id="top-ctrl-bar">
    <div style="display:flex; gap:8px;">
      <button class="ctrl-btn" id="ctrl-restart">다시하기 🔄</button>
      <button class="ctrl-btn" id="ctrl-exit">메인으로 🏠</button>
    </div>
    <button class="ctrl-btn" id="audio-toggle" title="배경음악 켜기/끄기">🔊</button>
  </div>

  <!-- 우드 아케이드 전광판 HUD -->
  <div id="hud-board">
    <div class="stat-badge">
      <div class="stat-label">SCORE</div>
      <div class="stat-val" id="val-score">0</div>
    </div>
    <div class="stat-badge">
      <div class="stat-label" id="label-timer">TIME</div>
      <div class="stat-val" id="val-timer">30</div>
    </div>
    <div class="stat-badge">
      <div class="stat-label">COMBO</div>
      <div class="stat-val" id="val-combo">0</div>
    </div>
  </div>

  <!-- 동적 서든데스 게이지 (2.0s -> 0.4s) -->
  <div id="survival-container">
    <div id="survival-bar"></div>
    <div id="survival-text">COMBO SURVIVAL (MAX 2.0s)</div>
  </div>

  <!-- 3x3 잔디밭 필드 -->
  <div id="field-container">
    <div id="field-grid"></div>
  </div>
</div>

<!-- 3초 카운트다운 오버레이 -->
<div id="countdown-overlay">
  <div id="countdown-num">3</div>
</div>

<!-- 시작 화면 모달 -->
<div id="start-modal" class="modal-overlay">
  <div class="card-modal">
    <h1>두더지 매니아 DX</h1>
    <p>
      💥 두더지를 타격하면 <strong>머리 위에 망치</strong>가 내리칩니다!<br>
      💣 <strong>폭탄</strong>은 감점 및 서든데스 즉시 탈락!<br>
      ⚡ <strong>30초 후 서든데스</strong>: 콤보 타이머(2.0s $\rightarrow$ 0.4s)
    </p>
    <div class="rank-table-wrap">
      <table class="rank-table">
        <thead><tr><th>순위</th><th>이름</th><th>점수</th></tr></thead>
        <tbody id="start-rank-body"></tbody>
      </table>
    </div>
    <div class="modal-btn-group">
      <button class="play-btn" id="btn-start">게임 시작! 🔨</button>
    </div>
  </div>
</div>

<!-- TOP 7 닉네임 입력 모달 -->
<div id="name-modal" class="modal-overlay" style="display:none;">
  <div class="card-modal">
    <h1>🎉 명예의 전당 등극!</h1>
    <p><span id="new-rank-pos" style="color:#d84315; font-size:16px;">1위</span> 기록을 달성했습니다!</p>
    <input type="text" id="player-name-input" class="name-input" maxlength="7" placeholder="이름 (최대 7자)" autofocus>
    <div class="modal-btn-group">
      <button class="play-btn" id="btn-save-name">등록하기 ✅</button>
      <button class="play-btn sec" id="btn-skip-name">건너뛰기</button>
    </div>
  </div>
</div>

<!-- 게임 오버 모달 -->
<div id="gameover-modal" class="modal-overlay" style="display:none;">
  <div class="card-modal">
    <h1 id="over-title">GAME OVER</h1>
    <p id="over-desc">최종 순위를 확인하세요!</p>
    <div style="font-size: 26px; font-weight:900; color:#d84315;" id="over-score">0점</div>
    <div style="font-size: 13px; color:#5d4037; margin-bottom: 8px;" id="over-maxcombo">최대 콤보: 0연속</div>
    
    <div class="rank-table-wrap">
      <table class="rank-table">
        <thead><tr><th>순위</th><th>이름</th><th>점수</th></tr></thead>
        <tbody id="gameover-rank-body"></tbody>
      </table>
    </div>

    <div class="modal-btn-group">
      <button class="play-btn" id="btn-restart">다시 하기 🔄</button>
      <button class="play-btn sec" id="btn-home">메인 화면 🏠</button>
    </div>
  </div>
</div>

<script>
(() => {
  // 우클릭 완전 방지
  window.addEventListener('contextmenu', (e) => e.preventDefault());

  const state = {
    score: 0,
    timeLeft: 30,
    combo: 0,
    maxCombo: 0,
    isPlaying: false,
    isCountingDown: false,
    isSuddenDeath: false,
    suddenDuration: 0,
    currentMaxSurvival: 2.0,
    survivalTimer: 2.0,
    soundEnabled: true,
    holes: Array(9).fill(null).map(() => ({ active: false, moleType: null, timer: null }))
  };

  const MAX_CONCURRENT_MOLES = 4;
  let gameTickInterval = null;
  let spawnTimeout = null;
  let countdownTimer = null;

  // Web Audio 및 BGM
  let audioCtx = null;
  let bgmInterval = null;
  let bgmStep = 0;

  const MELODY = [
    261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63, 0,
    293.66, 349.23, 440.00, 587.33, 440.00, 349.23, 293.66, 0,
    329.63, 392.00, 493.88, 659.25, 493.88, 392.00, 329.63, 0,
    392.00, 329.63, 293.66, 261.63, 293.66, 329.63, 261.63, 0
  ];

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startBgm() {
    stopBgm();
    if (!state.soundEnabled) return;
    initAudio();
    bgmStep = 0;
    bgmInterval = setInterval(playBgmStep, state.isSuddenDeath ? 120 : 155);
  }

  function stopBgm() {
    if (bgmInterval) {
      clearInterval(bgmInterval);
      bgmInterval = null;
    }
  }

  function playBgmStep() {
    if (!state.isPlaying || !state.soundEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;
    const note = MELODY[bgmStep % MELODY.length];
    if (note > 0) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(note, now);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    }
    bgmStep++;
  }

  function playSfx(type) {
    if (!state.soundEnabled || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.frequency.setValueAtTime(460, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.13);
      } else if (type === 'gold') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587, now);
        osc.frequency.setValueAtTime(987, now + 0.09);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.28);
      } else if (type === 'bomb') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.38);
        gain.gain.setValueAtTime(1.0, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.38);
        osc.start(now);
        osc.stop(now + 0.39);
      } else if (type === 'beep') {
        osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.16);
      } else if (type === 'beep_go') {
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.31);
      }
    } catch(e) {}
  }

  // 타격 시 나타나는 망치 SVG
  const HAMMER_SVG = `
    <svg viewBox="0 0 100 100" width="100%" height="100%">
      <rect x="28" y="28" width="14" height="64" rx="6" fill="#8d6e63" stroke="#3e2723" stroke-width="3.5" transform="rotate(45 35 60)"/>
      <rect x="14" y="14" width="40" height="40" rx="9" fill="#546e7a" stroke="#263238" stroke-width="4.5" transform="rotate(-45 34 34)"/>
      <rect x="18" y="18" width="32" height="12" rx="4" fill="#90a4ae" transform="rotate(-45 34 34)"/>
      <circle cx="34" cy="34" r="4.5" fill="#ff1744"/>
    </svg>
  `;

  // 두더지 SVG
  const MOLE_SVGS = {
    normal: `
      <svg viewBox="0 0 120 130">
        <ellipse cx="60" cy="74" rx="44" ry="50" fill="#6d4c41" stroke="#2e1b14" stroke-width="5"/>
        <circle cx="28" cy="38" r="13" fill="#6d4c41" stroke="#2e1b14" stroke-width="4"/>
        <circle cx="28" cy="38" r="7" fill="#f48fb1"/>
        <circle cx="92" cy="38" r="13" fill="#6d4c41" stroke="#2e1b14" stroke-width="4"/>
        <circle cx="92" cy="38" r="7" fill="#f48fb1"/>
        <ellipse cx="60" cy="85" rx="28" ry="20" fill="#d7ccc8" stroke="#2e1b14" stroke-width="4"/>
        <ellipse cx="60" cy="76" rx="9" ry="7" fill="#d81b60"/>
        <circle cx="38" cy="76" r="7" fill="#ffab91" opacity="0.85"/>
        <circle cx="82" cy="76" r="7" fill="#ffab91" opacity="0.85"/>
        <ellipse cx="46" cy="56" rx="7" ry="9" fill="#fff" stroke="#2e1b14" stroke-width="3"/>
        <ellipse cx="74" cy="56" rx="7" ry="9" fill="#fff" stroke="#2e1b14" stroke-width="3"/>
        <circle cx="48" cy="56" r="4.5" fill="#000"/>
        <circle cx="76" cy="56" r="4.5" fill="#000"/>
        <circle cx="50" cy="53" r="2" fill="#fff"/>
        <circle cx="78" cy="53" r="2" fill="#fff"/>
        <rect x="56" y="87" width="8" height="9" rx="2" fill="#fff" stroke="#2e1b14" stroke-width="2"/>
        <ellipse cx="30" cy="104" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
        <ellipse cx="90" cy="104" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
      </svg>
    `,
    helmet: `
      <svg viewBox="0 0 120 130">
        <ellipse cx="60" cy="78" rx="44" ry="48" fill="#5d4037" stroke="#2e1b14" stroke-width="5"/>
        <ellipse cx="60" cy="88" rx="28" ry="19" fill="#d7ccc8" stroke="#2e1b14" stroke-width="4"/>
        <ellipse cx="60" cy="80" rx="9" ry="7" fill="#d81b60"/>
        <ellipse cx="46" cy="62" rx="7" ry="8" fill="#fff" stroke="#2e1b14" stroke-width="3"/>
        <ellipse cx="74" cy="62" rx="7" ry="8" fill="#fff" stroke="#2e1b14" stroke-width="3"/>
        <circle cx="48" cy="62" r="4" fill="#000"/>
        <circle cx="76" cy="62" r="4" fill="#000"/>
        <path d="M16,48 Q60,12 104,48 Q106,54 60,54 Q14,54 16,48 Z" fill="#ffd600" stroke="#f57f17" stroke-width="5"/>
        <rect x="50" y="26" width="20" height="18" rx="4" fill="#fff" stroke="#f57f17" stroke-width="3"/>
        <path d="M60,30 L60,40 M54,35 L66,35" stroke="#d50000" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="30" cy="106" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
        <ellipse cx="90" cy="106" rx="12" ry="8" fill="#d7ccc8" stroke="#2e1b14" stroke-width="3.5"/>
      </svg>
    `,
    gold: `
      <svg viewBox="0 0 120 130">
        <ellipse cx="60" cy="74" rx="44" ry="50" fill="#ffb300" stroke="#ff6f00" stroke-width="5"/>
        <circle cx="28" cy="38" r="13" fill="#ffb300" stroke="#ff6f00" stroke-width="4"/>
        <circle cx="92" cy="38" r="13" fill="#ffb300" stroke="#ff6f00" stroke-width="4"/>
        <ellipse cx="60" cy="85" rx="28" ry="20" fill="#ffe082" stroke="#ff6f00" stroke-width="4"/>
        <circle cx="60" cy="76" r="7" fill="#e65100"/>
        <polygon points="34,34 44,10 60,24 76,10 86,34" fill="#ffd700" stroke="#e65100" stroke-width="4"/>
        <circle cx="60" cy="24" r="3.5" fill="#d50000"/>
        <rect x="32" y="52" width="22" height="16" rx="5" fill="#212121" stroke="#000" stroke-width="2"/>
        <rect x="66" y="52" width="22" height="16" rx="5" fill="#212121" stroke="#000" stroke-width="2"/>
        <line x1="54" y1="58" x2="66" y2="58" stroke="#000" stroke-width="4"/>
      </svg>
    `,
    bomb: `
      <svg viewBox="0 0 120 130">
        <path d="M60,34 Q74,18 88,22" fill="none" stroke="#8d6e63" stroke-width="5" stroke-linecap="round"/>
        <circle cx="90" cy="21" r="9" fill="#ffeb3b"/>
        <polygon points="90,10 96,26 82,16 99,19 86,28" fill="#ff1744"/>
        <circle cx="60" cy="76" r="42" fill="#212121" stroke="#000" stroke-width="5"/>
        <ellipse cx="46" cy="62" rx="10" ry="5" fill="#757575" transform="rotate(-30 46 62)"/>
        <circle cx="60" cy="76" r="14" fill="#fff"/>
        <circle cx="55" cy="74" r="3.5" fill="#212121"/>
        <circle cx="65" cy="74" r="3.5" fill="#212121"/>
        <rect x="56" y="84" width="8" height="6" rx="1" fill="#fff"/>
      </svg>
    `
  };

  // DOM 캐싱
  const gridEl = document.getElementById('field-grid');
  const valScore = document.getElementById('val-score');
  const valTimer = document.getElementById('val-timer');
  const valCombo = document.getElementById('val-combo');
  const labelTimer = document.getElementById('label-timer');
  const survivalContainer = document.getElementById('survival-container');
  const survivalBar = document.getElementById('survival-bar');
  const survivalText = document.getElementById('survival-text');
  const startModal = document.getElementById('start-modal');
  const gameoverModal = document.getElementById('gameover-modal');
  const nameModal = document.getElementById('name-modal');
  const viewport = document.getElementById('game-viewport');
  const audioToggleBtn = document.getElementById('audio-toggle');
  const countdownOverlay = document.getElementById('countdown-overlay');
  const countdownNum = document.getElementById('countdown-num');

  // 오디오 토글
  audioToggleBtn.addEventListener('click', () => {
    state.soundEnabled = !state.soundEnabled;
    audioToggleBtn.textContent = state.soundEnabled ? '🔊' : '🔇';
    if (!state.soundEnabled) stopBgm();
    else if (state.isPlaying) startBgm();
  });

  // 랭킹 스토리지 관리 (TOP 7)
  function getRankings() {
    try {
      const data = localStorage.getItem('whack_rankings_top7');
      if (data) return JSON.parse(data);
    } catch(e) {}
    return [
      { name: "ACE", score: 650 },
      { name: "HAMMER", score: 520 },
      { name: "SPEEDY", score: 410 },
      { name: "MOLE", score: 320 },
      { name: "LUCKY", score: 240 },
      { name: "ROOKIE", score: 180 },
      { name: "BEGIN", score: 100 }
    ];
  }

  function saveRankings(list) {
    list.sort((a, b) => b.score - a.score);
    const top7 = list.slice(0, 7);
    localStorage.setItem('whack_rankings_top7', JSON.stringify(top7));
    return top7;
  }

  function renderRankTable(tbodyId) {
    const list = getRankings();
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = list.map((item, idx) => `
      <tr class="${idx === 0 ? 'top1' : ''}">
        <td>${idx + 1}위</td>
        <td>${item.name}</td>
        <td>${item.score}점</td>
      </tr>
    `).join('');
  }
  renderRankTable('start-rank-body');

  // 9개 구멍 생성
  for (let i = 0; i < 9; i++) {
    const slot = document.createElement('div');
    slot.className = 'hole-slot';
    slot.innerHTML = `
      <div class="hole-back"></div>
      <div class="mole-wrapper" id="mole-${i}"></div>
      <div class="hole-front"></div>
    `;
    const moleWrapper = slot.querySelector('.mole-wrapper');
    moleWrapper.addEventListener('pointerdown', (e) => onMoleHit(i, e));
    gridEl.appendChild(slot);
  }

  // 0.6초 오클릭 방지 쿨다운 적용
  function applyButtonCooldown(modalEl) {
    const btns = modalEl.querySelectorAll('button');
    btns.forEach(b => b.classList.add('disabled-cooldown'));
    setTimeout(() => {
      btns.forEach(b => b.classList.remove('disabled-cooldown'));
    }, 600);
  }

  // 3초 카운트다운 후 게임 개시
  function requestGameStart() {
    if (state.isCountingDown) return;
    initAudio();

    // 열려있는 모달 정리
    startModal.style.display = 'none';
    gameoverModal.style.display = 'none';
    nameModal.style.display = 'none';
    viewport.classList.remove('sudden-flash');

    // 이전 상태 정리
    clearInterval(gameTickInterval);
    clearTimeout(spawnTimeout);
    clearTimeout(countdownTimer);
    stopBgm();

    state.isPlaying = false;
    state.isCountingDown = true;
    for (let i = 0; i < 9; i++) clearHole(i);

    let count = 3;
    countdownOverlay.style.display = 'flex';
    countdownNum.textContent = count;
    playSfx('beep');

    const doCount = () => {
      count--;
      if (count > 0) {
        countdownNum.textContent = count;
        countdownNum.style.animation = 'none';
        void countdownNum.offsetWidth;
        countdownNum.style.animation = 'countScale 0.85s cubic-bezier(0.1, 0.9, 0.2, 1)';
        playSfx('beep');
        countdownTimer = setTimeout(doCount, 900);
      } else {
        countdownNum.textContent = 'GO!';
        playSfx('beep_go');
        countdownTimer = setTimeout(() => {
          countdownOverlay.style.display = 'none';
          state.isCountingDown = false;
          launchGame();
        }, 500);
      }
    };

    countdownTimer = setTimeout(doCount, 900);
  }

  // 실질적 본게임 런칭
  function launchGame() {
    state.score = 0;
    state.timeLeft = 30; // 30초 본게임
    state.combo = 0;
    state.maxCombo = 0;
    state.isPlaying = true;
    state.isSuddenDeath = false;
    state.suddenDuration = 0;
    state.currentMaxSurvival = 2.0;
    state.survivalTimer = 2.0;

    for (let i = 0; i < 9; i++) clearHole(i);

    valScore.textContent = '0';
    valTimer.textContent = '30';
    valCombo.textContent = '0';
    labelTimer.textContent = 'TIME';
    survivalContainer.style.display = 'none';

    gameTickInterval = setInterval(gameTick, 100);
    spawnTimeout = setTimeout(scheduleSpawn, 500);
    startBgm();
  }

  // 버튼 이벤트 연결
  document.getElementById('btn-start').addEventListener('click', requestGameStart);
  document.getElementById('btn-restart').addEventListener('click', requestGameStart);
  document.getElementById('ctrl-restart').addEventListener('click', requestGameStart);
  document.getElementById('ctrl-exit').addEventListener('click', returnToMainMenu);
  document.getElementById('btn-home').addEventListener('click', returnToMainMenu);
  document.getElementById('btn-skip-name').addEventListener('click', () => {
    nameModal.style.display = 'none';
    showGameOverModal();
  });
  document.getElementById('btn-save-name').addEventListener('click', saveRankAndProceed);
  document.getElementById('player-name-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveRankAndProceed();
  });

  function returnToMainMenu() {
    state.isPlaying = false;
    state.isCountingDown = false;
    clearInterval(gameTickInterval);
    clearTimeout(spawnTimeout);
    clearTimeout(countdownTimer);
    stopBgm();

    countdownOverlay.style.display = 'none';
    gameoverModal.style.display = 'none';
    nameModal.style.display = 'none';
    viewport.classList.remove('sudden-flash');
    survivalContainer.style.display = 'none';

    for (let i = 0; i < 9; i++) clearHole(i);

    renderRankTable('start-rank-body');
    startModal.style.display = 'flex';
    applyButtonCooldown(startModal);
  }

  // 0.1초 메인 루프
  function gameTick() {
    if (!state.isPlaying) return;

    if (!state.isSuddenDeath) {
      state.timeLeft -= 0.1;
      valTimer.textContent = Math.max(0, Math.ceil(state.timeLeft));
      if (state.timeLeft <= 0) enterSuddenDeath();
    } else {
      state.suddenDuration += 0.1;
      // 2.0초에서 시작하여 0.4초까지 점진적 단축
      state.currentMaxSurvival = Math.max(0.4, 2.0 - (state.suddenDuration * 0.045));
      state.survivalTimer -= 0.1;

      const pct = Math.max(0, (state.survivalTimer / state.currentMaxSurvival) * 100);
      survivalBar.style.width = pct + '%';
      survivalText.textContent = `COMBO SURVIVAL (${state.survivalTimer.toFixed(1)}s / MAX ${state.currentMaxSurvival.toFixed(1)}s)`;

      if (state.survivalTimer <= 0) endGame('시간 초과! 서든데스 콤보 실패');
    }
  }

  function enterSuddenDeath() {
    state.isSuddenDeath = true;
    state.suddenDuration = 0;
    state.currentMaxSurvival = 2.0;
    state.survivalTimer = 2.0;

    labelTimer.textContent = 'MODE';
    valTimer.textContent = 'SURVIVE';
    survivalContainer.style.display = 'block';
    viewport.classList.add('sudden-flash');
    showPopText(window.innerWidth / 2, window.innerHeight / 2, '⚡ SUDDEN DEATH! ⚡', '#ff1744');
    startBgm();
  }

  function getStayDuration() {
    if (state.isSuddenDeath) return 800 + Math.random() * 200;
    const elapsed = 30 - state.timeLeft;
    return Math.max(750, 1500 - (elapsed * 25));
  }

  function getActiveCount() {
    return state.holes.filter(h => h.active).length;
  }

  // 동시 출현 최대 4개 제한 가드
  function scheduleSpawn() {
    if (!state.isPlaying) return;

    if (getActiveCount() < MAX_CONCURRENT_MOLES) {
      spawnMole();
    }

    const nextDelay = state.isSuddenDeath 
      ? 400 + Math.random() * 250
      : Math.max(380, 850 - ((30 - state.timeLeft) * 15));

    spawnTimeout = setTimeout(scheduleSpawn, nextDelay);
  }

  function spawnMole() {
    if (getActiveCount() >= MAX_CONCURRENT_MOLES) return;

    const freeSlots = [];
    for (let i = 0; i < 9; i++) {
      if (!state.holes[i].active) freeSlots.push(i);
    }
    if (freeSlots.length === 0) return;

    const slotIdx = freeSlots[Math.floor(Math.random() * freeSlots.length)];
    const hole = state.holes[slotIdx];

    const roll = Math.random();
    let type = 'normal';
    if (roll < 0.20) type = 'bomb';
    else if (roll < 0.40) type = 'gold';
    else if (roll < 0.65) type = 'helmet';

    hole.active = true;
    hole.moleType = type;

    const el = document.getElementById(`mole-${slotIdx}`);
    el.innerHTML = MOLE_SVGS[type];
    el.className = 'mole-wrapper up';

    const stayTime = getStayDuration();
    hole.timer = setTimeout(() => {
      if (hole.active) clearHole(slotIdx);
    }, stayTime);
  }

  function clearHole(idx) {
    const hole = state.holes[idx];
    if (hole.timer) clearTimeout(hole.timer);
    hole.active = false;
    hole.moleType = null;
    hole.timer = null;

    const el = document.getElementById(`mole-${idx}`);
    if (el) {
      el.className = 'mole-wrapper';
      el.innerHTML = '';
    }
  }

  // 타격 판정 및 두더지 머리 위 망치 표시
  function onMoleHit(idx, e) {
    if (!state.isPlaying) return;
    if (e.button !== undefined && e.button !== 0) return; // 우클릭 무시

    const hole = state.holes[idx];
    if (!hole.active) return;
    e.stopPropagation();

    const type = hole.moleType;
    const el = document.getElementById(`mole-${idx}`);
    const rect = el.getBoundingClientRect();
    const hitX = rect.left + rect.width / 2;
    const hitY = rect.top + rect.height / 3;

    // 타격된 두더지 머리 위에만 망치 생성
    const hammer = document.createElement('div');
    hammer.className = 'hammer-smash';
    hammer.innerHTML = HAMMER_SVG;
    el.parentElement.appendChild(hammer);
    setTimeout(() => hammer.remove(), 240);

    if (type === 'bomb') {
      playSfx('bomb');
      showPopText(hitX, hitY, 'BOOM! -50', '#d50000');
      state.score = Math.max(0, state.score - 50);
      state.combo = 0;
      valCombo.textContent = '0';
      valScore.textContent = state.score;
      clearHole(idx);

      if (state.isSuddenDeath) endGame('폭탄 타격! 서든데스 탈락');
    } else {
      let pts = 10;
      if (type === 'helmet') pts = 20;
      if (type === 'gold') pts = 40;

      state.combo++;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;

      const comboBonus = Math.min(30, state.combo * 2);
      const totalPts = pts + comboBonus;
      state.score += totalPts;

      valScore.textContent = state.score;
      valCombo.textContent = state.combo;

      if (type === 'gold') {
        playSfx('gold');
        showPopText(hitX, hitY, `JACKPOT! +${totalPts}`, '#ffd700');
      } else {
        playSfx('hit');
        showPopText(hitX, hitY, `+${totalPts}`, '#fff');
      }

      if (state.isSuddenDeath) {
        state.survivalTimer = state.currentMaxSurvival;
      }

      el.classList.add('hit');
      if (hole.timer) clearTimeout(hole.timer);
      setTimeout(() => clearHole(idx), 100);
    }
  }

  function showPopText(x, y, text, color) {
    const pop = document.createElement('div');
    pop.className = 'comic-pop';
    pop.textContent = text;
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    pop.style.color = color || '#ffeb3b';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 500);
  }

  // 게임 오버 처리
  function endGame(reason) {
    state.isPlaying = false;
    clearInterval(gameTickInterval);
    clearTimeout(spawnTimeout);
    stopBgm();
    viewport.classList.remove('sudden-flash');

    document.getElementById('over-title').textContent = state.isSuddenDeath ? '서든데스 종료!' : 'TIME UP!';
    document.getElementById('over-desc').textContent = reason || '멋진 플레이였습니다!';
    document.getElementById('over-score').textContent = `${state.score}점`;
    document.getElementById('over-maxcombo').textContent = `최고 콤보: ${state.maxCombo}연속`;

    const rankings = getRankings();
    const isTop7 = rankings.length < 7 || state.score > rankings[rankings.length - 1].score;

    if (isTop7 && state.score > 0) {
      let rankPos = 1;
      for (let r of rankings) {
        if (state.score <= r.score) rankPos++;
        else break;
      }
      document.getElementById('new-rank-pos').textContent = `${rankPos}위`;
      document.getElementById('player-name-input').value = '';
      nameModal.style.display = 'flex';
      applyButtonCooldown(nameModal);
      setTimeout(() => document.getElementById('player-name-input').focus(), 300);
    } else {
      showGameOverModal();
    }
  }

  function saveRankAndProceed() {
    let name = document.getElementById('player-name-input').value.trim() || 'HERO';
    const list = getRankings();
    list.push({ name: name.toUpperCase(), score: state.score });
    saveRankings(list);
    nameModal.style.display = 'none';
    showGameOverModal();
  }

  function showGameOverModal() {
    renderRankTable('gameover-rank-body');
    gameoverModal.style.display = 'flex';
    applyButtonCooldown(gameoverModal);
  }
})();
</script>
</body>
</html>
